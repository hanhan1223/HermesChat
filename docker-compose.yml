version: "3.9"

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes_password_2026
      POSTGRES_DB: hermes_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes_chat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存/队列
  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass hermes_redis_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "hermes_redis_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: hermes-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hermes
      MINIO_ROOT_KEY: hermes_minio_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Harness 服务 (NestJS) =====
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hermes-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hermes:hermes_password_2026@postgres:5432/hermes_chat?schema=public
      REDIS_URL: redis://:hermes_redis_2026@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: hermes
      MINIO_SECRET_KEY: hermes_minio_2026
      MINIO_BUCKET: hermes-chat
      JWT_SECRET: change-me-in-production-hermes-jwt-secret-key
      JWT_EXPIRES_IN: 7d
      ADMIN_API_URL: http://admin:8080
    ports:
      - "4000:4000"

  # ===== 管理后台 (Spring Boot) =====
  admin:
    build:
      context: ./hermes-admin
      dockerfile: Dockerfile
    container_name: hermes-admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hermes_chat
      SPRING_DATASOURCE_USERNAME: hermes
      SPRING_DATASOURCE_PASSWORD: hermes_password_2026
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: hermes_redis_2026
      JWT_SECRET: change-me-in-production-hermes-admin-jwt-secret-key-2026
    ports:
      - "8080:8080"

  # ===== 前端 (Next.js) =====
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hermes-web
    restart: unless-stopped
    depends_on:
      - api
      - admin
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
      NEXT_PUBLIC_ADMIN_URL: http://localhost:8080
    ports:
      - "3000:3000"

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: hermes-nginx
    restart: unless-stopped
    depends_on:
      - web
      - api
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro

volumes:
  postgres_data:
  redis_data:
  minio_data: