server:
  port: 8080
  servlet:
    context-path: /admin

spring:
  application:
    name: hermes-admin
  
  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/hermes_chat
    username: hermes
    password: hermes_password_2026
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password: hermes_redis_2026
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

# JWT 配置 - 3 个月免登录
jwt:
  secret: change-me-in-production-hermes-admin-jwt-secret-key-2026
  expiration: 7776000000  # 90天 (毫秒) = 3个月

# 日志配置
logging:
  level:
    root: INFO
    com.hermes.admin: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized