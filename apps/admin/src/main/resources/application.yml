server:
  port: 8080
  servlet:
    context-path: /admin

spring:
  application:
    name: hermes-admin

  # 数据库。生产/远程配置请放到 application-dev.yml（勿提交仓库）
  # URL 含冒号，不要放进 ${} 默认值（会解析失败）
  datasource:
    url: jdbc:postgresql://localhost:5432/hermes_chat
    username: hermes
    password: hermes_password_2026
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      password: hermes_redis_2026
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

# JWT — 与 Nest Harness 共用密钥（前端 localStorage.token 可直连管理 API）
jwt:
  secret: change-me-in-production-hermes-jwt-secret-key
  expiration: 7776000000

logging:
  level:
    root: INFO
    com.hermes.admin: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

gateway:
  enabled: true
  default-rate-limit-per-minute: 60
  provider-cache-ttl-ms: 30000
  connect-timeout-ms: 5000
  read-timeout-seconds: 120
